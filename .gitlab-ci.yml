stages:
  - validate
  - docker
  - package
  - deploy
  - verify

workflow:
  rules:
    # Production validation and deployment are intentionally driven only by
    # direct pushes to the deployment branch. Merge requests (including ones
    # that target main) must not create a competing pipeline.
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "shop-inventory"'

variables:
  DEPLOY_BRANCH: "shop-inventory"
  DEPLOY_PATH: "/opt/rainbow-fashions"
  DEPLOY_URL: "https://test.rainbow-fashions.in"
  LOCAL_DEPLOY_URL: "http://127.0.0.1:8080"
  PUBLIC_DEPLOY_URL: "https://test.rainbow-fashions.in"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

default:
  interruptible: true

backend_tests:
  stage: validate
  image: python:3.12-slim
  cache:
    key: backend-pip
    paths:
      - .cache/pip
  before_script:
    - python --version
    - apt-get update
    - apt-get install -y --no-install-recommends build-essential libpq-dev
    - python -m pip install --upgrade pip
    - pip install -r backend/requirements.txt
  script:
    - cd backend
    - pytest
    - test "$(alembic heads | grep -c '(head)')" -eq 1

frontend_quality:
  stage: validate
  image: node:20-alpine
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/.npm/
  before_script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline
  script:
    - npm run lint
    - npm run typecheck
    - npm run build
  artifacts:
    expire_in: 1 week
    paths:
      - frontend/dist/

verify_domain_preflight:
  stage: validate
  image: alpine:3.20
  before_script:
    - apk add --no-cache bash bind-tools curl python3 whois
    - chmod +x deployment/scripts/diagnose_domain.sh
  script:
    - REPORT_FILE="$CI_PROJECT_DIR/domain-diagnostics/domain-preflight.txt" deployment/scripts/diagnose_domain.sh
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - domain-diagnostics/
  rules:
    - if: '$CI_COMMIT_BRANCH == $DEPLOY_BRANCH && $CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_COMMIT_BRANCH == $DEPLOY_BRANCH'
      when: manual
    - when: never

docker_compose_build:
  stage: docker
  image: docker:27-cli
  before_script:
    - docker version
    - docker compose version
    - cp backend/.env.docker.example backend/.env
  script:
    - docker compose config --quiet
    - docker compose build
  after_script:
    - rm -f backend/.env

package_release:
  stage: package
  image: alpine:3.20
  needs:
    - backend_tests
    - frontend_quality
    - docker_compose_build
  script:
    - apk add --no-cache tar
    - tar -czf /tmp/rainbow-fashions-${CI_COMMIT_SHORT_SHA}.tar.gz --exclude=.git --exclude=frontend/node_modules --exclude=frontend/dist --exclude=backend/.env --exclude=backend/app/uploads .
    - mv /tmp/rainbow-fashions-${CI_COMMIT_SHORT_SHA}.tar.gz .
  artifacts:
    expire_in: 1 week
    paths:
      - rainbow-fashions-${CI_COMMIT_SHORT_SHA}.tar.gz
  rules:
    - if: $CI_COMMIT_BRANCH == $DEPLOY_BRANCH

.deploy_local:
  image: alpine:3.20
  rules:
    - if: $CI_COMMIT_BRANCH == $DEPLOY_BRANCH

deploy_phase_1_upload:
  extends: .deploy_local
  stage: deploy
  needs:
    - package_release
  resource_group: rainbow-fashions-production
  environment:
    name: production
    url: $DEPLOY_URL
  script:
    - export RELEASE_DIR="$DEPLOY_PATH/releases/$CI_COMMIT_SHORT_SHA"
    - mkdir -p "$RELEASE_DIR"
    - tar -xzf "rainbow-fashions-${CI_COMMIT_SHORT_SHA}.tar.gz" -C "$RELEASE_DIR"

deploy_phase_2_backup:
  extends: .deploy_local
  image: docker:27-cli
  stage: deploy
  needs:
    - deploy_phase_1_upload
  resource_group: rainbow-fashions-production
  environment:
    name: production
    url: $DEPLOY_URL
  script:
    - |
      set -e
      APP_DIR="$DEPLOY_PATH"
      BACKUP_DIR="$APP_DIR/backups"
      mkdir -p "$BACKUP_DIR"
      if [ -d "$APP_DIR/current" ]; then
        cd "$APP_DIR/current"
        docker compose ps postgres >/dev/null 2>&1
        docker compose exec -T postgres sh -ec 'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB"' > "$BACKUP_DIR/postgres_${CI_COMMIT_SHORT_SHA}_$(date +%Y%m%d_%H%M%S).sql"
      else
        echo 'No current release found; skipping database backup.'
      fi

deploy_phase_3_activate:
  extends: .deploy_local
  image: docker:27-cli
  stage: deploy
  needs:
    - deploy_phase_2_backup
  resource_group: rainbow-fashions-production
  environment:
    name: production
    url: $DEPLOY_URL
  script:
    - |
      set -e
      APP_DIR="$DEPLOY_PATH"
      RELEASE_DIR="$APP_DIR/releases/$CI_COMMIT_SHORT_SHA"
      ENV_FILE="$APP_DIR/shared/backend.env"
      apk add --no-cache bash curl openssl
      test -d "$RELEASE_DIR"
      test -s "$ENV_FILE" || { echo "$ENV_FILE is required. Create it from deployment/templates/backend.env.production.example on the server."; exit 1; }
      set -a
      . "$ENV_FILE"
      set +a
      [ "${APP_ENV:-}" = "production" ] || { echo 'APP_ENV must be production.'; exit 1; }
      [ "${DEBUG:-}" = "false" ] || { echo 'DEBUG must be false.'; exit 1; }
      [ -n "${POSTGRES_DB:-}" ] || { echo 'POSTGRES_DB is required.'; exit 1; }
      [ -n "${POSTGRES_USER:-}" ] || { echo 'POSTGRES_USER is required.'; exit 1; }
      [ -n "${POSTGRES_PASSWORD:-}" ] || { echo 'POSTGRES_PASSWORD is required.'; exit 1; }
      [ -n "${DATABASE_URL:-}" ] || { echo 'DATABASE_URL is required.'; exit 1; }
      [ -n "${JWT_SECRET_KEY:-}" ] || { echo 'JWT_SECRET_KEY is required.'; exit 1; }
      [ -n "${CORS_ORIGINS:-}" ] || { echo 'CORS_ORIGINS is required.'; exit 1; }
      [ "${#JWT_SECRET_KEY}" -ge 64 ] || { echo 'JWT_SECRET_KEY must be at least 64 characters.'; exit 1; }
      if grep -Ev '^[[:space:]]*(#|$)' "$ENV_FILE" | grep -Eqi 'replace-this|change-me|example'; then
        echo 'Production environment contains a placeholder value.'
        exit 1
      fi
      [ "$POSTGRES_PASSWORD" != "inventory123" ] || { echo 'POSTGRES_PASSWORD uses a rejected placeholder.'; exit 1; }
      EXPECTED_DATABASE_URL="postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      [ "$DATABASE_URL" = "$EXPECTED_DATABASE_URL" ] || { echo 'DATABASE_URL must match the PostgreSQL environment values.'; exit 1; }
      unset EXPECTED_DATABASE_URL
      mkdir -p "$APP_DIR/shared"
      PREVIOUS_RELEASE=""
      if [ -L "$APP_DIR/current" ]; then PREVIOUS_RELEASE="$(readlink -f "$APP_DIR/current")"; fi
      printf 'previous_release=%s\nnew_release=%s\nprevious_commit=%s\nnew_commit=%s\nbackup_path=%s\n' "$PREVIOUS_RELEASE" "$RELEASE_DIR" "${CI_COMMIT_BEFORE_SHA:-unknown}" "$CI_COMMIT_SHA" "$APP_DIR/backups" > "$RELEASE_DIR/deployment-metadata.env"
      rollback() {
        code="$?"
        [ "$code" -eq 0 ] && return 0
        echo "Deployment failed. Attempting application rollback; database migration may already have been applied."
        mkdir -p "$APP_DIR/failed-releases"
        docker compose logs --no-color --tail=300 > "$RELEASE_DIR/failed-release.log" 2>&1 || true
        if [ -n "$PREVIOUS_RELEASE" ] && [ -d "$PREVIOUS_RELEASE" ]; then
          ln -sfn "$PREVIOUS_RELEASE" "$APP_DIR/current"
          cp "$ENV_FILE" "$APP_DIR/current/backend/.env"
          cd "$APP_DIR/current"
          docker compose up -d
          ./deployment/scripts/wait_for_application.sh --base-url "$LOCAL_DEPLOY_URL" --timeout 180 || true
          PUBLIC_BASE_URL="$PUBLIC_DEPLOY_URL" LOCAL_BASE_URL="$LOCAL_DEPLOY_URL" ./deployment/scripts/smoke_test_production.sh || true
        fi
        exit "$code"
      }
      trap rollback EXIT
      ln -sfn "$RELEASE_DIR" "$APP_DIR/current"
      cd "$APP_DIR/current"
      chmod +x deployment/scripts/wait_for_application.sh deployment/scripts/smoke_test_production.sh
      cp "$ENV_FILE" backend/.env
      docker compose config --quiet
      docker compose build
      docker compose up -d postgres
      if docker compose exec -T postgres sh -ec 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "select 1 from information_schema.columns where table_name = '\''products'\'' and column_name = '\''sku'\''"' | grep -q 1 && ! docker compose exec -T postgres sh -ec 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "select to_regclass('\''public.alembic_version'\'')"' | grep -q alembic_version; then
        docker compose run --rm backend alembic stamp head
      fi
      docker compose run --rm backend alembic upgrade head
      docker compose up -d --remove-orphans
      ./deployment/scripts/wait_for_application.sh --base-url "$LOCAL_DEPLOY_URL" --timeout 180
      if ! docker compose exec -T backend python -c "from app.database.session import SessionLocal; from app.services.dashboard_service import DashboardService; from app.services.product_service import ProductService; db = SessionLocal(); ProductService(db).list_paginated(); DashboardService(db).summary(); db.close()"; then
        docker compose logs --tail=200 backend
        exit 1
      fi
      PUBLIC_BASE_URL="$PUBLIC_DEPLOY_URL" LOCAL_BASE_URL="$LOCAL_DEPLOY_URL" ./deployment/scripts/smoke_test_production.sh
      docker compose ps
      trap - EXIT

deploy_phase_4_verify:
  stage: verify
  image: alpine:3.20
  needs:
    - deploy_phase_3_activate
  environment:
    name: production
    url: $DEPLOY_URL
  script:
    - apk add --no-cache bash curl openssl
    - bash deployment/scripts/wait_for_application.sh --base-url "$LOCAL_DEPLOY_URL" --timeout 180
    - bash deployment/scripts/wait_for_application.sh --base-url "$PUBLIC_DEPLOY_URL" --timeout 180
    - PUBLIC_BASE_URL="$PUBLIC_DEPLOY_URL" LOCAL_BASE_URL="$LOCAL_DEPLOY_URL" bash deployment/scripts/smoke_test_production.sh
  rules:
    - if: $CI_COMMIT_BRANCH == $DEPLOY_BRANCH

diagnose_production_availability:
  extends: .deploy_local
  stage: verify
  image: alpine:3.20
  needs: []
  environment:
    name: production-diagnostics
  when: manual
  manual_confirmation: "Run read-only production availability diagnostics?"
  # Diagnostics are available on demand, but must not hold a verified release
  # in the blocked state.
  allow_failure: true
  script:
    - |
      set -eu
      apk add --no-cache bash curl docker-cli docker-cli-compose openssl procps util-linux
      APP_DIR="$DEPLOY_PATH/current"
      ARTIFACT_DIR="$CI_PROJECT_DIR/availability-diagnostics"
      mkdir -p "$ARTIFACT_DIR"
      test -d "$APP_DIR"
      cd "$APP_DIR"
      {
        echo "== docker compose ps =="
        docker compose ps || true
        echo "== container health =="
        docker inspect -f '{{.Name}} {{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' $(docker compose ps -q) || true
      } > "$ARTIFACT_DIR/docker.txt" 2>&1
      {
        systemctl status docker --no-pager || true
        systemctl status nginx --no-pager || true
        systemctl status rainbow-fashions --no-pager || true
      } > "$ARTIFACT_DIR/systemd.txt" 2>&1
      ss -lntp > "$ARTIFACT_DIR/listening-sockets.txt" 2>&1 || true
      {
        curl --silent --show-error --include --connect-timeout 5 --max-time 15 "$LOCAL_DEPLOY_URL/health/live" || true
        curl --silent --show-error --include --connect-timeout 5 --max-time 15 "$LOCAL_DEPLOY_URL/health/ready" || true
        curl --silent --show-error --include --connect-timeout 5 --max-time 15 "$PUBLIC_DEPLOY_URL/health/live" || true
        curl --silent --show-error --include --connect-timeout 5 --max-time 15 "$PUBLIC_DEPLOY_URL/health/ready" || true
      } > "$ARTIFACT_DIR/health.txt" 2>&1
      df -h > "$ARTIFACT_DIR/disk-usage.txt" 2>&1 || true
      df -ih > "$ARTIFACT_DIR/inode-usage.txt" 2>&1 || true
      docker system df > "$ARTIFACT_DIR/docker-disk.txt" 2>&1 || true
      host="${PUBLIC_DEPLOY_URL#https://}"; host="${host%%/*}"
      echo | openssl s_client -connect "$host:443" -servername "$host" 2>/dev/null | openssl x509 -noout -dates > "$ARTIFACT_DIR/certificate.txt" 2>&1 || true
      docker compose logs --tail=300 --no-color backend > "$ARTIFACT_DIR/backend.log" 2>&1 || true
      docker compose logs --tail=300 --no-color frontend > "$ARTIFACT_DIR/frontend.log" 2>&1 || true
      journalctl -u nginx -n 300 --no-pager > "$ARTIFACT_DIR/nginx-journal.log" 2>&1 || true
      journalctl -u rainbow-fashions -n 300 --no-pager > "$ARTIFACT_DIR/rainbow-fashions-journal.log" 2>&1 || true
      ls -la "$DEPLOY_PATH" "$DEPLOY_PATH/releases" > "$ARTIFACT_DIR/releases.txt" 2>&1 || true
  artifacts:
    when: always
    expire_in: 1 day
    paths:
      - availability-diagnostics/
  rules:
    - if: '$CI_COMMIT_BRANCH == $DEPLOY_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
    - when: never

# This is deliberately manual and is the only supported way to clear the
# production business database. It keeps user accounts, store configuration,
# and migration state, but clears all operational records and uploaded files.
database_reset_production:
  extends: .deploy_local
  image: docker:27-cli
  stage: verify
  needs:
    - deploy_phase_4_verify
  resource_group: rainbow-fashions-production
  environment:
    name: production
    url: $DEPLOY_URL
  when: manual
  manual_confirmation: "IRREVERSIBLE: back up then clear all production products, stock, purchases, sales, barcodes, documents, customers, suppliers, and uploads. Keep only users and stores?"
  # Resetting data is an exceptional, destructive maintenance action. It must
  # remain explicitly runnable, but it must not hold an otherwise verified
  # deployment in the blocked state.
  allow_failure: true
  script:
    - chmod +x scripts/database/clear_production_data.sh
    - DEPLOY_PATH="$DEPLOY_PATH" scripts/database/clear_production_data.sh --confirm-clear-production-data

# Temporary, read-only production diagnostic. This GitLab instance does not
# offer protected environments, so access is constrained by the protected
# deployment branch and the job remains intentionally manual.
diagnose_barcode_assignment_production:
  extends: .deploy_local
  stage: verify
  # This read-only job does not consume build artifacts. Schedule it
  # independently so an unrelated optional manual deployment job cannot cause
  # the diagnostic to be skipped.
  needs: []
  image: docker:27-cli
  environment:
    name: production-diagnostics
  when: manual
  manual_confirmation: "Run read-only production diagnostics for barcode 8906058070526?"
  allow_failure: true
  script:
    - |
      set -eu
      APP_DIR="/opt/rainbow-fashions/current"
      ARTIFACT_DIR="$CI_PROJECT_DIR/production-diagnostics"
      test -d "$APP_DIR"
      test -f "$APP_DIR/docker-compose.yml"
      mkdir -p "$ARTIFACT_DIR"
      cd "$APP_DIR"

      docker compose ps
      docker compose config --services

      docker compose logs --since=60m --no-color backend > /tmp/rainbow-backend-barcode-diagnostic.log
      grep -E -A30 -B15 '8906058070526|sale_mode|UndefinedColumn|ProgrammingError|IntegrityError|Traceback|product_barcodes|product_barcode_audits|stock_scan_session_items' /tmp/rainbow-backend-barcode-diagnostic.log > /tmp/rainbow-backend-barcode-error.txt || true
      docker compose logs --tail=300 --no-color backend > /tmp/rainbow-backend-tail.txt

      docker compose exec -T backend alembic current > /tmp/rainbow-alembic-current.txt 2>&1 || true
      docker compose exec -T backend alembic heads > /tmp/rainbow-alembic-heads.txt 2>&1 || true
      docker compose exec -T backend alembic history -r -10:head > /tmp/rainbow-alembic-history.txt 2>&1 || true

      docker compose exec -T postgres sh -lc 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -P pager=off -c "SELECT column_name, data_type, is_nullable, column_default FROM information_schema.columns WHERE table_schema = '\''public'\'' AND table_name = '\''product_barcodes'\'' ORDER BY ordinal_position;"' > /tmp/rainbow-product-barcodes-columns.txt 2>&1
      docker compose exec -T postgres sh -lc 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -P pager=off -c "SELECT column_name, data_type, is_nullable, column_default FROM information_schema.columns WHERE table_schema = '\''public'\'' AND table_name = '\''product_barcode_audits'\'' ORDER BY ordinal_position;"' > /tmp/rainbow-product-barcode-audits-columns.txt 2>&1
      docker compose exec -T postgres sh -lc 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -P pager=off -c "SELECT column_name, data_type, is_nullable, column_default FROM information_schema.columns WHERE table_schema = '\''public'\'' AND table_name = '\''stock_scan_session_items'\'' ORDER BY ordinal_position;"' > /tmp/rainbow-stock-scan-columns.txt 2>&1
      docker compose exec -T postgres sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_schema = '\''public'\'' AND table_name = '\''product_barcodes'\'' AND column_name = '\''sale_mode'\'');"' > /tmp/rainbow-sale-mode-exists.txt 2>&1
      docker compose exec -T postgres sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -P pager=off -c "SELECT version_num FROM alembic_version;"' > /tmp/rainbow-database-alembic-version.txt 2>&1

      git -C "$APP_DIR" rev-parse HEAD > /tmp/rainbow-deployed-commit.txt 2>&1 || true
      git -C "$APP_DIR" status --short > /tmp/rainbow-deployed-status.txt 2>&1 || true
      cp /tmp/rainbow-backend-barcode-error.txt /tmp/rainbow-backend-tail.txt /tmp/rainbow-alembic-current.txt /tmp/rainbow-alembic-heads.txt /tmp/rainbow-alembic-history.txt /tmp/rainbow-product-barcodes-columns.txt /tmp/rainbow-product-barcode-audits-columns.txt /tmp/rainbow-stock-scan-columns.txt /tmp/rainbow-sale-mode-exists.txt /tmp/rainbow-database-alembic-version.txt /tmp/rainbow-deployed-commit.txt /tmp/rainbow-deployed-status.txt "$ARTIFACT_DIR/"

      echo "Docker services: $(docker compose ps --services | tr '\n' ' ')"
      echo "Alembic current: $(head -n 1 /tmp/rainbow-alembic-current.txt)"
      echo "Alembic head: $(head -n 1 /tmp/rainbow-alembic-heads.txt)"
      echo "sale_mode exists: $(tr -d '[:space:]' < /tmp/rainbow-sale-mode-exists.txt)"
      if grep -q 'Traceback' /tmp/rainbow-backend-barcode-error.txt; then echo 'Traceback found: yes'; else echo 'Traceback found: no'; fi
      echo "Diagnostic artifact: $ARTIFACT_DIR"
  artifacts:
    when: always
    expire_in: 1 day
    paths:
      - production-diagnostics/
  rules:
    - if: '$CI_COMMIT_BRANCH == $DEPLOY_BRANCH'
      when: manual
    - when: never

# This job is deliberately manual. Protect the production-database-import
# environment and configure DATABASE_MIGRATION_ENV_FILE as a protected File
# variable in GitLab before enabling it. No database dump is stored as a CI
# artifact; it must first be staged by scripts/database/upload_database_dump.sh.
database_import_production:
  stage: deploy
  image: alpine:3.20
  resource_group: rainbow-fashions-production
  environment:
    name: production-database-import
  when: manual
  manual_confirmation: "Import the staged database after the verified backup and rollback plan have been reviewed."
  # An import remains an explicit, protected manual action. It must not block
  # ordinary application deployments when no import is requested.
  allow_failure: true
  before_script:
    - apk add --no-cache bash openssh-client
    - chmod +x scripts/database/*.sh
  script:
    - test -n "${DATABASE_MIGRATION_ENV_FILE:-}"
    - test -n "${MIGRATION_IMPORT_CONFIRMATION:-}"
    - scripts/database/import_remote_database.sh --confirm-replace
  rules:
    - if: '$CI_COMMIT_BRANCH == $DEPLOY_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
    - when: never

# Read-only operational proof. Configure the production environment as protected
# in GitLab so only authorized operators can run this job.
verify_production_backup_recovery:
  extends: .deploy_local
  stage: verify
  needs: []
  resource_group: rainbow-fashions-production
  environment:
    name: production-backup-verification
  when: manual
  manual_confirmation: "Collect redacted production backup and recovery evidence?"
  allow_failure: false
  script:
    - |
      set -eu
      APP_DIR="/opt/rainbow-fashions/current"
      BACKUP_DIR="/opt/rainbow-fashions/backups"
      ARTIFACT_DIR="$CI_PROJECT_DIR/production-backup-evidence"
      test -x "$APP_DIR/deployment/scripts/generate_backup_evidence_report.sh"
      mkdir -p "$ARTIFACT_DIR"
      systemctl is-enabled rainbow-database-backup.timer > "$ARTIFACT_DIR/database-timer-enabled.txt"
      systemctl is-active rainbow-database-backup.timer > "$ARTIFACT_DIR/database-timer-active.txt"
      systemctl list-timers rainbow-database-backup.timer rainbow-offsite-backup.timer rainbow-backup-restore-test.timer rainbow-backup-health.timer > "$ARTIFACT_DIR/timers.txt"
      systemctl status --no-pager rainbow-database-backup.service rainbow-offsite-backup.service rainbow-backup-restore-test.service rainbow-backup-health.service > "$ARTIFACT_DIR/services.txt" || true
      "$APP_DIR/deployment/scripts/generate_backup_evidence_report.sh" > "$ARTIFACT_DIR/evidence-path.txt"
      evidence="$(tail -n 1 "$ARTIFACT_DIR/evidence-path.txt")"
      cp "$evidence" "${evidence%.json}.txt" "$ARTIFACT_DIR/"
      find "$BACKUP_DIR/status" -maxdepth 1 -type f -name '*.json' -exec cp {} "$ARTIFACT_DIR/" \;
      df -h / "$BACKUP_DIR" > "$ARTIFACT_DIR/disk-usage.txt"
      docker system df > "$ARTIFACT_DIR/docker-disk-usage.txt"
      python3 - "$evidence" <<'PY'
      import json
      import sys
      report = json.load(open(sys.argv[1], encoding="utf-8"))
      if report.get("overall_status") != "PROTECTED":
          raise SystemExit("Backup recovery evidence is AT_RISK")
      PY
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - production-backup-evidence/
  rules:
    - if: '$CI_COMMIT_BRANCH == $DEPLOY_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
    - when: never
