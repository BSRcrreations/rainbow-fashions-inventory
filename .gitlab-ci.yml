stages:
  - validate
  - docker
  - package
  - deploy
  - verify

workflow:
  rules:
    # Production validation and deployment are intentionally driven only by
    # direct pushes to the deployment branch. Merge requests (including ones
    # that target main) must not create a competing pipeline.
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "shop-inventory"'

variables:
  DEPLOY_BRANCH: "shop-inventory"
  DEPLOY_PATH: "/opt/rainbow-fashions"
  DEPLOY_URL: "http://178.238.237.182"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

default:
  interruptible: true

backend_tests:
  stage: validate
  image: python:3.12-slim
  cache:
    key: backend-pip
    paths:
      - .cache/pip
  before_script:
    - python --version
    - apt-get update
    - apt-get install -y --no-install-recommends build-essential libpq-dev
    - python -m pip install --upgrade pip
    - pip install -r backend/requirements.txt
  script:
    - cd backend
    - pytest
    - test "$(alembic heads | grep -c '(head)')" -eq 1

frontend_quality:
  stage: validate
  image: node:20-alpine
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/.npm/
  before_script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline
  script:
    - npm run lint
    - npm run typecheck
    - npm run build
  artifacts:
    expire_in: 1 week
    paths:
      - frontend/dist/

docker_compose_build:
  stage: docker
  image: docker:27-cli
  before_script:
    - docker version
    - docker compose version
    - cp backend/.env.docker.example backend/.env
  script:
    - docker compose config --quiet
    - docker compose build
  after_script:
    - rm -f backend/.env

package_release:
  stage: package
  image: alpine:3.20
  needs:
    - backend_tests
    - frontend_quality
  script:
    - apk add --no-cache tar
    - tar -czf /tmp/rainbow-fashions-${CI_COMMIT_SHORT_SHA}.tar.gz --exclude=.git --exclude=frontend/node_modules --exclude=frontend/dist --exclude=backend/.env --exclude=backend/app/uploads .
    - mv /tmp/rainbow-fashions-${CI_COMMIT_SHORT_SHA}.tar.gz .
  artifacts:
    expire_in: 1 week
    paths:
      - rainbow-fashions-${CI_COMMIT_SHORT_SHA}.tar.gz
  rules:
    - if: $CI_COMMIT_BRANCH == $DEPLOY_BRANCH

.deploy_local:
  image: alpine:3.20
  rules:
    - if: $CI_COMMIT_BRANCH == $DEPLOY_BRANCH

deploy_phase_1_upload:
  extends: .deploy_local
  stage: deploy
  needs:
    - package_release
  resource_group: rainbow-fashions-production
  environment:
    name: production
    url: $DEPLOY_URL
  script:
    - export RELEASE_DIR="$DEPLOY_PATH/releases/$CI_COMMIT_SHORT_SHA"
    - mkdir -p "$RELEASE_DIR"
    - tar -xzf "rainbow-fashions-${CI_COMMIT_SHORT_SHA}.tar.gz" -C "$RELEASE_DIR"

deploy_phase_2_backup:
  extends: .deploy_local
  image: docker:27-cli
  stage: deploy
  needs:
    - deploy_phase_1_upload
  resource_group: rainbow-fashions-production
  environment:
    name: production
    url: $DEPLOY_URL
  script:
    - |
      set -e
      APP_DIR="$DEPLOY_PATH"
      BACKUP_DIR="$APP_DIR/backups"
      mkdir -p "$BACKUP_DIR"
      if [ -d "$APP_DIR/current" ]; then
        cd "$APP_DIR/current"
        docker compose ps postgres >/dev/null 2>&1
        docker compose exec -T postgres sh -ec 'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB"' > "$BACKUP_DIR/postgres_${CI_COMMIT_SHORT_SHA}_$(date +%Y%m%d_%H%M%S).sql"
      else
        echo 'No current release found; skipping database backup.'
      fi

deploy_phase_3_activate:
  extends: .deploy_local
  image: docker:27-cli
  stage: deploy
  needs:
    - deploy_phase_2_backup
  resource_group: rainbow-fashions-production
  environment:
    name: production
    url: $DEPLOY_URL
  script:
    - |
      set -e
      APP_DIR="$DEPLOY_PATH"
      RELEASE_DIR="$APP_DIR/releases/$CI_COMMIT_SHORT_SHA"
      ENV_FILE="$APP_DIR/shared/backend.env"
      test -d "$RELEASE_DIR"
      # The first hardened deployment may follow releases that kept their
      # runtime environment inside the active release. Move that existing
      # secret file to the persistent shared location once. If this is a
      # legacy deployment with no secret file, create secrets only on the
      # production host and rotate the existing local PostgreSQL role to the
      # new generated password. Secrets are never committed or printed.
      if [ ! -s "$ENV_FILE" ]; then
        PREVIOUS_ENV_FILE="$APP_DIR/current/backend/.env"
        if [ -s "$PREVIOUS_ENV_FILE" ]; then
          mkdir -p "$APP_DIR/shared"
          cp "$PREVIOUS_ENV_FILE" "$ENV_FILE"
          chmod 600 "$ENV_FILE"
          echo 'Bootstrapped shared production backend.env from the active release.'
        else
          test -d "$APP_DIR/current" || { echo 'No active release is available for secure environment bootstrap.'; exit 1; }
          mkdir -p "$APP_DIR/shared"
          umask 077
          BOOTSTRAP_POSTGRES_PASSWORD="$(od -An -N48 -tx1 /dev/urandom | tr -d ' \n')"
          BOOTSTRAP_JWT_SECRET="$(od -An -N64 -tx1 /dev/urandom | tr -d ' \n')"
          BOOTSTRAP_ENV_FILE="$ENV_FILE.bootstrap"
          {
            printf '%s\n' 'APP_NAME="Rainbow Fashions Inventory"'
            printf '%s\n' 'APP_ENV=production' 'DEBUG=false'
            printf '%s\n' 'POSTGRES_DB=inventory_db' 'POSTGRES_USER=inventory_user'
            printf 'POSTGRES_PASSWORD=%s\n' "$BOOTSTRAP_POSTGRES_PASSWORD"
            printf 'DATABASE_URL=postgresql+psycopg://inventory_user:%s@postgres:5432/inventory_db\n' "$BOOTSTRAP_POSTGRES_PASSWORD"
            printf 'JWT_SECRET_KEY=%s\n' "$BOOTSTRAP_JWT_SECRET"
            printf '%s\n' 'JWT_ALGORITHM=HS256' 'ACCESS_TOKEN_EXPIRE_MINUTES=480'
            printf '%s\n' 'CORS_ORIGINS=http://178.238.237.182,https://test.rainbow-fashions.in'
            printf '%s\n' 'UPLOAD_DIR=app/uploads' 'INVOICE_UPLOAD_DIR=app/uploads/invoices' 'PRODUCT_UPLOAD_DIR=app/uploads/products' 'MAX_UPLOAD_SIZE_MB=15' 'LOG_LEVEL=INFO'
            printf '%s\n' 'OCR_PROVIDER=local' 'DOCUMENT_AI_PROVIDER=mock' 'DOCUMENT_AI_FALLBACK_PROVIDER=mock' 'DOCUMENT_AI_TIMEOUT_SECONDS=90' 'DOCUMENT_AI_MAX_RETRIES=2' 'DOCUMENT_RETENTION_DAYS=365' 'FAILED_UPLOAD_RETENTION_DAYS=7'
          } > "$BOOTSTRAP_ENV_FILE"
          (
            cd "$APP_DIR/current"
            docker compose exec -T postgres sh -ec "psql -v ON_ERROR_STOP=1 -U inventory_user -d inventory_db -c \"ALTER ROLE inventory_user WITH PASSWORD '$BOOTSTRAP_POSTGRES_PASSWORD';\""
          )
          mv "$BOOTSTRAP_ENV_FILE" "$ENV_FILE"
          chmod 600 "$ENV_FILE"
          unset BOOTSTRAP_ENV_FILE BOOTSTRAP_POSTGRES_PASSWORD BOOTSTRAP_JWT_SECRET
          echo 'Generated and stored a secure production backend.env on the deployment host.'
        fi
        unset PREVIOUS_ENV_FILE
      fi
      set -a
      . "$ENV_FILE"
      set +a
      [ "${APP_ENV:-}" = "production" ] || { echo 'APP_ENV must be production.'; exit 1; }
      [ "${DEBUG:-}" = "false" ] || { echo 'DEBUG must be false.'; exit 1; }
      [ -n "${POSTGRES_DB:-}" ] || { echo 'POSTGRES_DB is required.'; exit 1; }
      [ -n "${POSTGRES_USER:-}" ] || { echo 'POSTGRES_USER is required.'; exit 1; }
      [ -n "${POSTGRES_PASSWORD:-}" ] || { echo 'POSTGRES_PASSWORD is required.'; exit 1; }
      [ -n "${DATABASE_URL:-}" ] || { echo 'DATABASE_URL is required.'; exit 1; }
      [ -n "${JWT_SECRET_KEY:-}" ] || { echo 'JWT_SECRET_KEY is required.'; exit 1; }
      [ -n "${CORS_ORIGINS:-}" ] || { echo 'CORS_ORIGINS is required.'; exit 1; }
      [ "${#JWT_SECRET_KEY}" -ge 64 ] || { echo 'JWT_SECRET_KEY must be at least 64 characters.'; exit 1; }
      if grep -Ev '^[[:space:]]*(#|$)' "$ENV_FILE" | grep -Eqi 'replace-this|change-me|example'; then
        echo 'Production environment contains a placeholder value.'
        exit 1
      fi
      [ "$POSTGRES_PASSWORD" != "inventory123" ] || { echo 'POSTGRES_PASSWORD uses a rejected placeholder.'; exit 1; }
      EXPECTED_DATABASE_URL="postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      [ "$DATABASE_URL" = "$EXPECTED_DATABASE_URL" ] || { echo 'DATABASE_URL must match the PostgreSQL environment values.'; exit 1; }
      unset EXPECTED_DATABASE_URL
      mkdir -p "$APP_DIR/shared"
      ln -sfn "$RELEASE_DIR" "$APP_DIR/current"
      cd "$APP_DIR/current"
      cp "$ENV_FILE" backend/.env
      docker compose config --quiet
      docker compose build
      docker compose up -d postgres
      if docker compose exec -T postgres sh -ec 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "select 1 from information_schema.columns where table_name = '\''products'\'' and column_name = '\''sku'\''"' | grep -q 1 && ! docker compose exec -T postgres sh -ec 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "select to_regclass('\''public.alembic_version'\'')"' | grep -q alembic_version; then
        docker compose run --rm backend alembic stamp head
      fi
      docker compose run --rm backend alembic upgrade head
      docker compose up -d --remove-orphans
      if ! docker compose exec -T backend python -c "from app.database.session import SessionLocal; from app.services.dashboard_service import DashboardService; from app.services.product_service import ProductService; db = SessionLocal(); ProductService(db).list_paginated(); DashboardService(db).summary(); db.close()"; then
        docker compose logs --tail=200 backend
        exit 1
      fi
      docker compose ps

deploy_phase_4_verify:
  stage: verify
  image: curlimages/curl:8.11.1
  needs:
    - deploy_phase_3_activate
  environment:
    name: production
    url: $DEPLOY_URL
  script:
    - curl --fail --retry 12 --retry-delay 5 "$DEPLOY_URL/"
    - curl --fail --retry 12 --retry-delay 5 "$DEPLOY_URL/health"
  rules:
    - if: $CI_COMMIT_BRANCH == $DEPLOY_BRANCH

# Temporary, read-only production diagnostic. This GitLab instance does not
# offer protected environments, so access is constrained by the protected
# deployment branch and the job remains intentionally manual.
diagnose_barcode_assignment_production:
  extends: .deploy_local
  stage: verify
  image: docker:27-cli
  environment:
    name: production-diagnostics
  when: manual
  manual_confirmation: "Run read-only production diagnostics for barcode 8906058070526?"
  allow_failure: true
  script:
    - |
      set -eu
      APP_DIR="/opt/rainbow-fashions/current"
      test -d "$APP_DIR"
      test -f "$APP_DIR/docker-compose.yml"
      cd "$APP_DIR"
      mkdir -p production-diagnostics

      docker compose ps
      docker compose config --services

      docker compose logs --since=60m --no-color backend > /tmp/rainbow-backend-barcode-diagnostic.log
      grep -E -A30 -B15 '8906058070526|sale_mode|UndefinedColumn|ProgrammingError|IntegrityError|Traceback|product_barcodes|product_barcode_audits|stock_scan_session_items' /tmp/rainbow-backend-barcode-diagnostic.log > /tmp/rainbow-backend-barcode-error.txt || true
      docker compose logs --tail=300 --no-color backend > /tmp/rainbow-backend-tail.txt

      docker compose exec -T backend alembic current > /tmp/rainbow-alembic-current.txt 2>&1 || true
      docker compose exec -T backend alembic heads > /tmp/rainbow-alembic-heads.txt 2>&1 || true
      docker compose exec -T backend alembic history -r -10:head > /tmp/rainbow-alembic-history.txt 2>&1 || true

      docker compose exec -T postgres sh -lc 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -P pager=off -c "SELECT column_name, data_type, is_nullable, column_default FROM information_schema.columns WHERE table_schema = '\''public'\'' AND table_name = '\''product_barcodes'\'' ORDER BY ordinal_position;"' > /tmp/rainbow-product-barcodes-columns.txt 2>&1
      docker compose exec -T postgres sh -lc 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -P pager=off -c "SELECT column_name, data_type, is_nullable, column_default FROM information_schema.columns WHERE table_schema = '\''public'\'' AND table_name = '\''product_barcode_audits'\'' ORDER BY ordinal_position;"' > /tmp/rainbow-product-barcode-audits-columns.txt 2>&1
      docker compose exec -T postgres sh -lc 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -P pager=off -c "SELECT column_name, data_type, is_nullable, column_default FROM information_schema.columns WHERE table_schema = '\''public'\'' AND table_name = '\''stock_scan_session_items'\'' ORDER BY ordinal_position;"' > /tmp/rainbow-stock-scan-columns.txt 2>&1
      docker compose exec -T postgres sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_schema = '\''public'\'' AND table_name = '\''product_barcodes'\'' AND column_name = '\''sale_mode'\'');"' > /tmp/rainbow-sale-mode-exists.txt 2>&1
      docker compose exec -T postgres sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -P pager=off -c "SELECT version_num FROM alembic_version;"' > /tmp/rainbow-database-alembic-version.txt 2>&1

      git -C "$APP_DIR" rev-parse HEAD > /tmp/rainbow-deployed-commit.txt 2>&1 || true
      git -C "$APP_DIR" status --short > /tmp/rainbow-deployed-status.txt 2>&1 || true
      cp /tmp/rainbow-backend-barcode-error.txt /tmp/rainbow-backend-tail.txt /tmp/rainbow-alembic-current.txt /tmp/rainbow-alembic-heads.txt /tmp/rainbow-alembic-history.txt /tmp/rainbow-product-barcodes-columns.txt /tmp/rainbow-product-barcode-audits-columns.txt /tmp/rainbow-stock-scan-columns.txt /tmp/rainbow-sale-mode-exists.txt /tmp/rainbow-database-alembic-version.txt /tmp/rainbow-deployed-commit.txt /tmp/rainbow-deployed-status.txt production-diagnostics/

      echo "Docker services: $(docker compose ps --services | tr '\n' ' ')"
      echo "Alembic current: $(head -n 1 /tmp/rainbow-alembic-current.txt)"
      echo "Alembic head: $(head -n 1 /tmp/rainbow-alembic-heads.txt)"
      echo "sale_mode exists: $(tr -d '[:space:]' < /tmp/rainbow-sale-mode-exists.txt)"
      if grep -q 'Traceback' /tmp/rainbow-backend-barcode-error.txt; then echo 'Traceback found: yes'; else echo 'Traceback found: no'; fi
      echo "Diagnostic artifact: production-diagnostics/"
  artifacts:
    when: always
    expire_in: 1 day
    paths:
      - production-diagnostics/
  rules:
    - if: '$CI_COMMIT_BRANCH == $DEPLOY_BRANCH'
      when: manual
    - when: never

# This job is deliberately manual. Protect the production-database-import
# environment and configure DATABASE_MIGRATION_ENV_FILE as a protected File
# variable in GitLab before enabling it. No database dump is stored as a CI
# artifact; it must first be staged by scripts/database/upload_database_dump.sh.
database_import_production:
  stage: deploy
  image: alpine:3.20
  resource_group: rainbow-fashions-production
  environment:
    name: production-database-import
  when: manual
  manual_confirmation: "Import the staged database after the verified backup and rollback plan have been reviewed."
  allow_failure: false
  before_script:
    - apk add --no-cache bash openssh-client
    - chmod +x scripts/database/*.sh
  script:
    - test -n "${DATABASE_MIGRATION_ENV_FILE:-}"
    - test -n "${MIGRATION_IMPORT_CONFIRMATION:-}"
    - scripts/database/import_remote_database.sh --confirm-replace
  rules:
    - if: '$CI_COMMIT_BRANCH == $DEPLOY_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
    - when: never
