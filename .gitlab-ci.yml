stages:
  - validate
  - docker
  - package
  - deploy
  - verify

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "shop-inventory" || $CI_COMMIT_BRANCH == "main")'
    - when: never

variables:
  GIT_STRATEGY: "clone"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

default:
  interruptible: true

.validation_rules:
  rules:
    - if: '$CI_COMMIT_BRANCH == "shop-inventory" || $CI_COMMIT_BRANCH == "main"'
    - when: never

backend_tests:
  stage: validate
  image: python:3.12-slim
  tags: [rainbow-ci]
  extends: .validation_rules
  cache:
    key: backend-pip
    paths: [.cache/pip]
  before_script:
    - python --version
    - apt-get update
    - apt-get install -y --no-install-recommends build-essential git libpq-dev
    - rm -rf /var/lib/apt/lists/*
    - python -m pip install --upgrade pip
    - pip install -r backend/requirements.txt
  script:
    - cd backend
    - python -m compileall app
    - pytest
    - test "$(alembic heads | grep -c '(head)')" -eq 1
    - python -c "from app.main import app; assert app.openapi().get('openapi')"

frontend_quality:
  stage: validate
  image: node:20-alpine
  tags: [rainbow-ci]
  extends: .validation_rules
  cache: []
  before_script:
    - cd frontend
    - npm ci --include=dev --prefer-online --no-audit --no-fund
  script:
    - npm test -- --run
    - npm run lint
    - npm run typecheck
    - npm run build
    - |
      if ! npm audit --omit=dev --audit-level=high; then
        if [ "${NPM_AUDIT_ALLOW_HIGH_AND_CRITICAL:-false}" != "true" ]; then
          echo 'npm audit found high or critical production dependency advisories. Set the protected exception variable only after a reviewed, time-bound approval.'
          exit 1
        fi
        echo 'npm audit high/critical exception accepted by protected CI variable.'
      fi

tracked_secret_check:
  stage: validate
  image: alpine:3.20
  tags: [rainbow-ci]
  extends: .validation_rules
  script:
    - apk add --no-cache bash git
    - bash scripts/security/check_tracked_secrets.sh

fixed_password_hash_check:
  stage: validate
  image: alpine:3.20
  tags: [rainbow-ci]
  extends: .validation_rules
  script:
    - apk add --no-cache bash git
    - bash scripts/security/check_fixed_password_hashes.sh

repository_artifact_check:
  stage: validate
  image: alpine:3.20
  tags: [rainbow-ci]
  extends: .validation_rules
  script:
    - apk add --no-cache bash git
    - bash scripts/security/check_repository_artifacts.sh

gitleaks_check:
  stage: validate
  image:
    name: zricethezav/gitleaks:v8.24.2
    entrypoint: [""]
  tags: [rainbow-ci]
  extends: .validation_rules
  variables:
    GIT_DEPTH: "0"
  script:
    - >
      gitleaks detect
      --source .
      --redact
      --no-banner
      --exit-code 1

verify_domain_preflight:
  stage: validate
  image: alpine:3.20
  tags: [rainbow-ci]
  extends: .validation_rules
  before_script:
    - apk add --no-cache bash bind-tools curl python3 whois
    - chmod +x deployment/scripts/diagnose_domain.sh
  script:
    - DNS_ONLY=true ROOT_DOMAIN=rainbow-fashions.in APP_DOMAIN=test.rainbow-fashions.in EXPECTED_IPV4=178.238.237.182 REPORT_FILE="$CI_PROJECT_DIR/domain-diagnostics/test-domain-preflight.txt" deployment/scripts/diagnose_domain.sh
    - DNS_ONLY=true ROOT_DOMAIN=rainbow-fashions.in APP_DOMAIN=rainbow-fashions.in EXPECTED_IPV4=178.238.237.182 REPORT_FILE="$CI_PROJECT_DIR/domain-diagnostics/production-domain-preflight.txt" deployment/scripts/diagnose_domain.sh
  artifacts:
    when: always
    expire_in: 7 days
    paths: [domain-diagnostics/]

docker_compose_build:
  stage: docker
  image: docker:27-cli
  tags: [rainbow-ci]
  extends: .validation_rules
  before_script:
    - docker version
    - docker compose version
    - cp backend/.env.docker.example backend/.env
    - mkdir -p .ci-runtime/uploads .ci-runtime/opening-stock-imports .ci-runtime/backups/status
    - export BACKEND_ENV_FILE="$CI_PROJECT_DIR/backend/.env" UPLOADS_HOST_PATH="$CI_PROJECT_DIR/.ci-runtime/uploads" OPENING_STOCK_IMPORTS_HOST_PATH="$CI_PROJECT_DIR/.ci-runtime/opening-stock-imports" BACKUP_STATUS_HOST_PATH="$CI_PROJECT_DIR/.ci-runtime/backups/status"
  script:
    - docker compose -p rainbow_test -f docker-compose.yml -f docker-compose.test.yml config --quiet
    - docker compose -p rainbow_prod -f docker-compose.yml -f docker-compose.prod.yml config --quiet
    - docker compose -p rainbow_test -f docker-compose.yml -f docker-compose.test.yml build
    - docker compose -p rainbow_prod -f docker-compose.yml -f docker-compose.prod.yml build
  after_script:
    - rm -f backend/.env

package_release:
  stage: package
  image: alpine:3.20
  tags: [rainbow-ci]
  extends: .validation_rules
  needs: [backend_tests, frontend_quality, docker_compose_build, gitleaks_check]
  script:
    - apk add --no-cache tar
    - tar -czf /tmp/rainbow-fashions-${CI_COMMIT_SHORT_SHA}.tar.gz --exclude=.git --exclude=frontend/node_modules --exclude=frontend/dist --exclude=backend/.env --exclude=backend/app/uploads .
    - mv /tmp/rainbow-fashions-${CI_COMMIT_SHORT_SHA}.tar.gz .
  artifacts:
    expire_in: 1 week
    paths:
      - "rainbow-fashions-${CI_COMMIT_SHORT_SHA}.tar.gz"

.test_deployment:
  tags: [rainbow-test]
  resource_group: rainbow-fashions-test
  environment:
    name: staging
    url: https://test.rainbow-fashions.in
  rules:
    - if: '$CI_COMMIT_BRANCH == "shop-inventory" && $CI_COMMIT_REF_PROTECTED == "true"'
    - when: never

.production_deployment:
  tags: [rainbow-production]
  resource_group: rainbow-fashions-production
  environment:
    name: production
    url: https://rainbow-fashions.in
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
    - when: never

deploy_test:
  stage: deploy
  extends: .test_deployment
  needs: [package_release]
  script:
    - export DEPLOY_ENVIRONMENT=test DEPLOY_PATH=/opt/rainbow-fashions-test COMPOSE_PROJECT_NAME=rainbow_test BACKEND_ENV_FILE=/opt/rainbow-fashions-test/shared/backend.env COMPOSE_OVERRIDE=docker-compose.test.yml LOCAL_DEPLOY_URL=http://127.0.0.1:8081 PUBLIC_DEPLOY_URL=https://test.rainbow-fashions.in UPLOADS_HOST_PATH=/opt/rainbow-fashions-test/runtime/uploads OPENING_STOCK_IMPORTS_HOST_PATH=/opt/rainbow-fashions-test/runtime/opening-stock-imports BACKUP_STATUS_HOST_PATH=/opt/rainbow-fashions-test/runtime/backups/status
    - bash deployment/scripts/verify_deployment_context.sh
    - export RELEASE_DIR="$DEPLOY_PATH/releases/$CI_COMMIT_SHORT_SHA"
    - install -d -m 750 "$RELEASE_DIR"
    - tar -xzf "rainbow-fashions-${CI_COMMIT_SHORT_SHA}.tar.gz" -C "$RELEASE_DIR"
    - bash "$RELEASE_DIR/deployment/scripts/backup_before_deploy.sh"
    - bash "$RELEASE_DIR/deployment/scripts/deploy_release.sh"

verify_test:
  stage: verify
  extends: .test_deployment
  needs: [deploy_test]
  script:
    - curl --fail --silent --show-error --max-time 15 https://test.rainbow-fashions.in/health/live
    - curl --fail --silent --show-error --max-time 15 https://test.rainbow-fashions.in/health/ready

deploy_production:
  stage: deploy
  extends: .production_deployment
  needs: [package_release]
  manual_confirmation: "Deploy the validated main commit to production after reviewing the verified backup plan?"
  script:
    - export DEPLOY_ENVIRONMENT=production DEPLOY_PATH=/opt/rainbow-fashions-prod COMPOSE_PROJECT_NAME=rainbow_prod BACKEND_ENV_FILE=/opt/rainbow-fashions-prod/shared/backend.env COMPOSE_OVERRIDE=docker-compose.prod.yml LOCAL_DEPLOY_URL=http://127.0.0.1:8080 PUBLIC_DEPLOY_URL=https://rainbow-fashions.in UPLOADS_HOST_PATH=/opt/rainbow-fashions-prod/runtime/uploads OPENING_STOCK_IMPORTS_HOST_PATH=/opt/rainbow-fashions-prod/runtime/opening-stock-imports BACKUP_STATUS_HOST_PATH=/opt/rainbow-fashions-prod/runtime/backups/status
    - bash deployment/scripts/verify_deployment_context.sh
    - export RELEASE_DIR="$DEPLOY_PATH/releases/$CI_COMMIT_SHORT_SHA"
    - install -d -m 750 "$RELEASE_DIR"
    - tar -xzf "rainbow-fashions-${CI_COMMIT_SHORT_SHA}.tar.gz" -C "$RELEASE_DIR"
    - bash "$RELEASE_DIR/deployment/scripts/backup_before_deploy.sh"
    - bash "$RELEASE_DIR/deployment/scripts/deploy_release.sh"

verify_production:
  stage: verify
  extends: .production_deployment
  needs: [deploy_production]
  script:
    - curl --fail --silent --show-error --max-time 15 https://rainbow-fashions.in/health/live
    - curl --fail --silent --show-error --max-time 15 https://rainbow-fashions.in/health/ready
    - curl --fail --silent --show-error --max-time 15 https://www.rainbow-fashions.in/login
