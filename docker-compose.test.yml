# Isolated UAT stack. Start only through scripts/start-test-environment.sh.
name: rainbow-inventory-test

services:
  rainbow-test-db:
    container_name: rainbow-test-db
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ${TEST_DOCKER_ENV_FILE:?Run scripts/start-test-environment.sh to prepare the UAT environment file.}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - rainbow_test_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20

  rainbow-test-backend:
    container_name: rainbow-test-backend
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ${TEST_DOCKER_ENV_FILE:?Run scripts/start-test-environment.sh to prepare the UAT environment file.}
    depends_on:
      rainbow-test-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - rainbow_test_uploads:/app/app/test_uploads
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/ready', timeout=5).read()"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  rainbow-test-frontend:
    container_name: rainbow-test-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile.test
      args:
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    depends_on:
      rainbow-test-backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:5174:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  rainbow_test_postgres_data:
  rainbow_test_uploads:
