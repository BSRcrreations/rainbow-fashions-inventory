# Host-level Nginx configuration for the Rainbow Fashions public hostnames.
#
# Prerequisite: the Docker frontend must be bound only to 127.0.0.1:8080
# (as configured in docker-compose.yml). Do not enable this virtual host until
# the production hardening and HTTP service health checks have passed.

server {
    listen 80;
    listen [::]:80;
    server_name test.rainbow-fashions.in rainbow-fashions.in www.rainbow-fashions.in;
    access_log /var/log/nginx/test.rainbow-fashions.in.access.log;
    error_log /var/log/nginx/test.rainbow-fashions.in.error.log warn;

    # LetsEncrypt HTTP-01 challenge path. Certbot must be able to write here.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name test.rainbow-fashions.in rainbow-fashions.in www.rainbow-fashions.in;

    ssl_certificate /etc/letsencrypt/live/test.rainbow-fashions.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.rainbow-fashions.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 15m;
    access_log /var/log/nginx/test.rainbow-fashions.in.access.log;
    error_log /var/log/nginx/test.rainbow-fashions.in.error.log warn;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

    # The frontend container owns SPA fallback, /api/, /health, and /uploads/
    # routing on the internal Docker network. No FastAPI port is published.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
