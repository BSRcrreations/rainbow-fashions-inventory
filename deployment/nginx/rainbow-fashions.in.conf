# Production virtual server.  Install only after the existing production data
# and PostgreSQL volume have been identified and backed up.  Certbot manages
# the TLS paths; this site must never proxy to the test stack.
server {
    listen 80;
    listen [::]:80;
    server_name rainbow-fashions.in www.rainbow-fashions.in;
    client_max_body_size 15m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rainbow-fashions.in www.rainbow-fashions.in;

    ssl_certificate /etc/letsencrypt/live/rainbow-fashions.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rainbow-fashions.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    client_max_body_size 15m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
