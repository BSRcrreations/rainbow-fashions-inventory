services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # A host bind mount lets the host backup service archive all uploads.
      - ${UPLOADS_HOST_PATH:-./runtime/uploads}:/app/app/uploads
      # Uploaded opening-stock evidence is private operational data, never a Git asset.
      - ${OPENING_STOCK_IMPORTS_HOST_PATH:-./runtime/opening-stock-imports}:/app/app/runtime/opening-stock-imports
      # Status is operational metadata only and is displayed to owners by API.
      - ${BACKUP_STATUS_HOST_PATH:-./runtime/backups/status}:/backup-status:ro
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/ready', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Keep the application reachable until host Nginx and TLS are installed.
      # Switch to 127.0.0.1:8080:80 only as the final hostname-rollout step.
      - "80:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
