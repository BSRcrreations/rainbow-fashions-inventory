# Common services for the isolated test and production environments.  Always
# start this file with exactly one environment override and a project name:
#
#   docker compose -p rainbow_test -f docker-compose.yml -f docker-compose.test.yml …
#   docker compose -p rainbow_prod -f docker-compose.yml -f docker-compose.prod.yml …
#
# The project name scopes the network and the named PostgreSQL volume.  The
# three bind mounts and backend environment file must be supplied by the
# deployment job; no environment file is stored in a release checkout.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ${BACKEND_ENV_FILE:?BACKEND_ENV_FILE must point to the protected environment file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ${BACKEND_ENV_FILE:?BACKEND_ENV_FILE must point to the protected environment file}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${UPLOADS_HOST_PATH:?UPLOADS_HOST_PATH must be set}:/app/app/uploads
      - ${OPENING_STOCK_IMPORTS_HOST_PATH:?OPENING_STOCK_IMPORTS_HOST_PATH must be set}:/app/app/runtime/opening-stock-imports
      - ${BACKUP_STATUS_HOST_PATH:?BACKUP_STATUS_HOST_PATH must be set}:/backup-status:ro
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/ready', timeout=5).read()"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  # Docker prefixes this volume with the Compose project name.  It becomes
  # rainbow_test_postgres_data or rainbow_prod_postgres_data in deployment.
  postgres_data:
